# Exemplo de ACTION reutilizavel do KofCloud (Fase 18 slice 3).
#
# Este arquivo e EXEMPLO da action que o plano chama de kofcloud/deploy@v1:
# copie a pasta para um repositorio proprio (ex: github.com/sua-org/deploy)
# e referencie com uses: sua-org/deploy@v1. Num workflow da SUA aplicacao:
#
#   - uses: sua-org/deploy@v1
#     with:
#       handle: ${{ secrets.KOF_HANDLE }}
#       password: ${{ secrets.KOF_PASSWORD }}   # mascarado pelo Actions
#       control-url: ${{ secrets.KOF_CONTROL_URL }}
#
# Pre-requisito honesto (igual ao pipeline de exemplo, e vale para o
# WORKFLOW que usa a action): o runner tem de ser self-hosted na maquina
# que roda `kof cloud connect` — o deploy publica e o `--check` sonda o
# servico LOCAL desta maquina; num runner de nuvem o publish funciona, mas
# o check nao teria o que verificar.
#
# A senha nunca aparece no log: viaja como input do composite, sai do
# segredo mascarado pelo Actions e chega ao comando por env do passo
# ($KOF_PASSWORD), nunca inline no run. O login usa o device fixo `ci` —
# o re-registro dedupa no device vivo, entao rodar a action nao gera
# devices novos nem estoura o teto de cadastro.

name: 'KofCloud deploy'
description: 'Publica e verifica o manifesto kofcloud.json (plan + check)'
inputs:
  handle:
    description: 'Handle da conta KofCloud'
    required: true
  password:
    description: 'Senha da conta — SEMPRE alimente de secrets.* (o Actions mascara o valor)'
    required: true
  control-url:
    description: 'URL do control plane (https)'
    required: true
  device:
    description: 'Device usado pelo CI (re-registro dedupa no device vivo)'
    required: false
    default: 'ci'
runs:
  using: 'composite'
  steps:
    - name: Login (device fixo ci)
      shell: bash
      run: kof cloud login "$KOF_HANDLE" --password "$KOF_PASSWORD" --control "$KOF_CONTROL_URL" --device "$KOF_DEVICE"
      env:
        KOF_HANDLE: ${{ inputs.handle }}
        KOF_PASSWORD: ${{ inputs.password }}
        KOF_CONTROL_URL: ${{ inputs.control-url }}
        KOF_DEVICE: ${{ inputs.device }}

    # Diff sem aplicar (como `terraform plan`): revisavel no PR.
    - name: Plano
      shell: bash
      run: kof cloud deploy --plan

    # Publica e verifica: build declarado por servico roda antes;
    # falha a action se algum servico divergir ou nao responder.
    - name: Deploy + verificacao
      shell: bash
      run: kof cloud deploy --check
